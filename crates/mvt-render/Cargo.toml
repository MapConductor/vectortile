[package]
name = "mvt-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent MapLibre-style vector tile rasterizer"

[dependencies]
tiny-skia.workspace = true
serde.workspace = true
serde_json.workspace = true
earcutr = { version = "0.5", optional = true }
# Direct dependency for encoding externally produced RGBA buffers (the GPU
# path's readback). Already in the tree transitively via tiny-skia, so this
# adds no new code to any build.

# Test-only. The renderer must not depend on the style compiler -- they ship
# as separate libraries on purpose -- but the compiler's claim about which
# expressions this renderer can evaluate has to be checked against it.
[dev-dependencies]
mvt-style = { path = "../mvt-style" }

[features]
default = []
# Triangulation for the OpenGL ES experiment. Off by default: the CPU
# rasteriser fills paths directly and never needs triangles.
tessellate = ["dep:earcutr"]

# The tessellation examples cannot build without the feature; declaring that
# lets a plain `cargo test` skip them instead of failing.
[[example]]
name = "tessellate_file"
required-features = ["tessellate"]

[[example]]
name = "export_stencil_experiment"
required-features = ["tessellate"]

[[example]]
name = "tessellate_compare"
required-features = ["tessellate"]

[[example]]
name = "pipeline_cost"
required-features = ["tessellate"]
