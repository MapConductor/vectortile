[package]
name = "mvt-style-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings for mvt-style"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mvt-style = { path = "../mvt-style" }
wasm-bindgen = "0.2"

# See mvt-render-wasm: the bundled wasm-opt predates the features rustc emits
# by default and will not validate its own input without `-all`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '-all']
