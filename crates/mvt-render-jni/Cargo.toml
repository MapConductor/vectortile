[package]
name = "mvt-render-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JNI bindings for mvt-render"

[lib]
crate-type = ["cdylib"]

[dependencies]
mvt-render = { path = "../mvt-render" }
jni = "0.21"

[features]
# Triangulation for the OpenGL ES experiment. Off for the SDK build, which
# rasterises on the CPU and never needs triangles.
tessellate = ["mvt-render/tessellate"]
