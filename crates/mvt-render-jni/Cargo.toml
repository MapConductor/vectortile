[package]
name = "mvt-render-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JNI bindings for mvt-render"

[lib]
crate-type = ["cdylib"]

[dependencies]
mvt-render = { path = "../mvt-render" }
jni = "0.21"

[features]
# Triangulation and the fast PNG encoder, for the GPU rendering mode.
tessellate = ["mvt-render/tessellate"]
# Extra JNI exports named for the OpenGL ES experiment's Kotlin class. The SDK
# library must not carry symbols naming a class it does not ship, so this is
# separate from `tessellate`, which the SDK does enable.
glbench-compat = ["tessellate"]
