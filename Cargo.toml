[workspace]
resolver = "2"
members = [
    "crates/mvt-render",
    "crates/mvt-style",
    "crates/mvt-style-jni",
    "crates/mvt-style-ffi",
    "crates/mvt-style-wasm",
    "crates/tile-png",
    "crates/tile-png-jni",
    "crates/tile-png-ffi",
    "crates/mvt-render-wasm",
    "crates/mvt-render-jni",
    "crates/mvt-render-ffi",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Unwinding is kept on purpose. `panic = "abort"` would be smaller, but this
# code ships inside someone else's Android or iOS app, where a panic must
# surface as an exception or an error code — not take the host process down.
# The FFI crates catch unwinds at their boundaries.
strip = true

# The encoder is the exception to the size-first default above. It ships in the
# SDK core precisely because it is faster than the platform encoder, so building
# it for size would be building away the reason it is there. Stripping already
# recovers more bytes than opt-level "z" saves here.
[profile.release.package.tile-png]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

# Android renders on the device's critical path. Keep the size-first release
# profile for other consumers, but optimize native Android rendering for speed.
# Pixel 5a measurements and reproduction steps: docs/android-performance.md.
[profile.android-release]
inherits = "release"
opt-level = 3
