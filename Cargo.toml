[workspace]
resolver = "2"
members = [
    "crates/mvt-render",
    "crates/mvt-render-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
