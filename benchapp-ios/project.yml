name: VTBench
options:
  bundleIdPrefix: com.mapconductor
  deploymentTarget:
    iOS: "15.1"
packages:
  MapConductorVectorTile:
    path: ../bindings/ios
  MapConductorCore:
    path: ../../ios-sdk/ios-sdk-core
targets:
  VTBench:
    type: application
    platform: iOS
    sources:
      - Sources
      # As individual resources, not a folder reference: a top-level directory
      # literally named "Resources" makes codesign misdetect the iOS bundle as
      # the old macOS layout and fail with "code object is not signed at all".
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MapConductorVectorTile
        product: MapConductorVectorTile
      # The marker tile renderer, so the bench can time a real tile on device.
      # It also brings in TilePng, whose C symbols the bridging header declares
      # so the encoder can be timed against the platform's directly — the core
      # keeps its Swift wrapper internal, and a benchmark is no reason to widen
      # a public API.
      - package: MapConductorCore
        product: MapConductorCore

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapconductor.vtbench
        DEVELOPMENT_TEAM: 4DUVX7999A
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The previews debug-dylib bundle layout breaks codesign in this
        # generated project; a plain single binary signs cleanly.
        ENABLE_PREVIEWS: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/VTBench-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources
