<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>MapConductor vector tile renderer harness</title>
        <style>
            html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
            #map { position: absolute; inset: 0; }
            #status {
                position: absolute; top: 8px; left: 8px; z-index: 1;
                background: rgba(255, 255, 255, 0.92); padding: 8px 10px;
                border-radius: 6px; max-width: 46ch; white-space: pre-wrap;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            }
            /* Kept out of the document flow rather than layered over the map:
               stacking a 2D canvas on top of the WebGL canvas makes headless
               Chromium composite it at the wrong offset, which shows up as a
               phantom rectangle in screenshots. */
            #probe { display: none; }
            #probe-view {
                position: absolute; bottom: 8px; right: 8px; z-index: 1;
                width: 192px; height: 192px; border: 1px solid #999;
                background: #fff; object-fit: contain;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <pre id="status">starting…</pre>
        <!-- One tile rendered straight through the provider, for a
             deterministic pixel assertion that does not depend on the map.
             The canvas stays hidden (getImageData works either way); the
             <img> is what a human looks at. -->
        <canvas id="probe" width="256" height="256"></canvas>
        <img id="probe-view" alt="tile 0/0/0 rendered by the provider" />
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
