<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>MapConductor vector tile renderer harness</title>
        <style>
            :root { color-scheme: light; }
            html, body { margin: 0; height: 100%; font: 13px/1.5 system-ui, sans-serif; }
            #app { display: flex; height: 100%; }
            #panel {
                width: 310px; flex: none; overflow-y: auto; padding: 14px;
                border-right: 1px solid #d8d8d8; background: #fafafa; box-sizing: border-box;
            }
            #map { flex: 1; position: relative; }
            h1 { font-size: 14px; margin: 0 0 4px; }
            h2 { font-size: 12px; margin: 18px 0 6px; text-transform: uppercase;
                 letter-spacing: 0.04em; color: #666; }
            #status { white-space: pre-wrap; font-family: ui-monospace, monospace;
                      font-size: 11px; color: #444; margin: 0; }
            .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
            .row label { flex: 1; min-width: 0; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
            .row .prop { color: #888; font-size: 11px; }
            .row input[type="color"] { width: 34px; height: 24px; padding: 0;
                                       border: 1px solid #bbb; background: none; }
            .badge { font-size: 10px; background: #e5e0ff; color: #4b3ea8;
                     border-radius: 3px; padding: 1px 4px; }
            button { font: inherit; padding: 4px 10px; }
            #colour-filter { width: 100%; box-sizing: border-box; padding: 4px 6px;
                             font: inherit; margin-bottom: 4px; }
            #colour-count { color: #888; font-size: 11px; margin: 0 0 6px; }
            .reset { padding: 2px 6px; font-size: 11px; }
            #probe-view { width: 100%; border: 1px solid #ccc; background: #fff;
                          margin-top: 6px; }
            #timing { color: #444; font-size: 11px; min-height: 1.5em; }
        </style>
    </head>
    <body>
        <div id="app">
            <aside id="panel">
                <h1>Vector tile renderer</h1>
                <pre id="status">starting…</pre>

                <h2>Style colours</h2>
                <!-- A real basemap style has hundreds of colour properties, so
                     the list needs narrowing to be usable at all. -->
                <input id="colour-filter" type="search" placeholder="filter by layer or property…" />
                <p id="colour-count"></p>
                <div id="colors"></div>
                <p id="timing"></p>
                <button id="reset-all">Reset all colours</button>

                <h2>Tile 0/0/0</h2>
                <!-- Rendered straight through the provider. The canvas stays
                     hidden for pixel assertions; the <img> is what a human
                     looks at. Neither overlaps the map: layering a 2D canvas
                     over the WebGL canvas makes headless Chromium composite it
                     at the wrong offset. -->
                <canvas id="probe" width="256" height="256" style="display: none"></canvas>
                <img id="probe-view" alt="tile 0/0/0 rendered by the provider" />
            </aside>
            <div id="map"></div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
